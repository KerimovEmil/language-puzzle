<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Puzzle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 1rem;
  }
  .container {
    max-width: 600px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    color: #666;
    font-size: 1rem;
    margin-bottom: 2.5rem;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  .card {
    display: block;
    background: #fff;
    border-radius: 16px;
    padding: 2.5rem 1.5rem;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    border: 1px solid #eee;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  .card:active {
    transform: translateY(-1px);
  }
  .card h2 {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .card p {
    font-size: 0.85rem;
    color: #999;
  }
  .footer-note {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: #bbb;
  }
  @media (max-width: 450px) {
    .grid { grid-template-columns: 1fr; gap: 1rem; }
    .card { padding: 2rem 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Language Puzzle</h1>
  <p class="subtitle">6 pictures, 1 word — can you find it?</p>

  <div class="grid">
    <a class="card" href="P1/problem_1.html">
      <h2>Puzzle 1</h2>
      <p>6 pictures, 1 word</p>
    </a>
    <a class="card" href="P2/problem_2.html">
      <h2>Puzzle 2</h2>
      <p>6 pictures, 1 word</p>
    </a>
  </div>

  <p class="footer-note">Click a puzzle to begin</p>
</div>
</body>
</html>
